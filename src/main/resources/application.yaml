spring:
  application:
    name: notification-service
  profiles:
    # Used when no profile is set; run locally with SPRING_PROFILES_ACTIVE=local
    default: prod
  data:
    web:
      pageable:
        max-page-size: 100
server:
  # Render injects PORT
  port: ${PORT:8081}

cookies:
  secure: true
  sameSite: Lax
  httpOnly: true
