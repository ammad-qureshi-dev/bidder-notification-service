spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/postgres?prepareThreshold=0
    username: ${DB_USER}
    password: ${DB_PWD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      # This clears any cached prepared statements before reusing the connection.
      connection-init-sql: "DISCARD ALL"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    port: 587
    host: 'smtp.gmail.com'
    username: ${MAIL_USERNAME}
    password: ${MAIL_PWD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false
        transport:
          protocol: 'smtp'
  output:
    ansi:
      enabled: ALWAYS
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:bidder-kafka-bidder.i.aivencloud.com:15237}
    # Aiven: SASL (SCRAM) auth over SSL, trusting Aiven's CA certificate (ca.pem)
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION}
      ssl.endpoint.identification.algorithm: https
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
server:
  port: ${PORT:8081}

logging:
  level:
    root: info
    com.bidder.notification_service: info

retry-limit: 3

internal-services:
  identity-and-auth-service: ${IDENTITY_AND_AUTH_SERVICE_URL:http://localhost:8084}

identity-and-auth-service:
  get-preferred-contact: /api/v1/app-user/contacts/preferred-contact-method
  get-contact-methods: /api/v1/app-user/contacts
  get-app-user: /api/v1/app-user/{userId}

client-url: ${CLIENT_URL:http://localhost:3000}
